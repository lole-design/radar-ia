name: Actualizar Radar IA

on:
  schedule:
    - cron: "0 11 * * 1,3,5"   # lunes, miércoles y viernes a las 11:00 UTC
  workflow_dispatch:            # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ["scripts/**", "static/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  issues: write

concurrency:
  group: radar-ia
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolectar proyectos y noticias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/collect.py

      - name: Guardar la edición en el repositorio
        run: |
          git config user.name "radar-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Edición del $(date -u +%F)"
            git push
          fi

      - name: Generar la web
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar por email si algo falla
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Falló la actualización del $(date -u +%F)" \
            --body "La actualización automática de Radar IA ha fallado. Registro completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
